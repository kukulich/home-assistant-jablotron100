name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt homeassistant

      - name: Run mypy
        run: python -m mypy

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt

      - name: Run tests
        run: python -m pytest

  integration-tests:
    name: Home Assistant (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [minimum, latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_integration_test.txt
            hacs.json

      - name: Install integration test dependencies
        env:
          HA_TARGET: ${{ matrix.homeassistant }}
        run: |
          if [ "$HA_TARGET" = "minimum" ]; then
            HA_REQUIREMENT="homeassistant==$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
          else
            HA_REQUIREMENT="homeassistant"
          fi
          python -m pip install --upgrade --requirement requirements_integration_test.txt "$HA_REQUIREMENT"
          python -m pip check
          python -c 'from importlib.metadata import version; print("Home Assistant:", version("homeassistant"))'

      - name: Run tests with real Home Assistant
        run: python -m pytest --ha-integration
